[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "openai>=1.70,<3", "beautifulsoup4>=4.13,<5", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["app*", "sandbox*", "proxy*", "demo_docs*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.css"]
proxy = ["squid.conf.template"]
demo_docs = ["*.html", "*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: real Docker integration; opt in with RUN_DOCKER_TESTS=1"]

