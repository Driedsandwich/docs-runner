name: docsrunner
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DOCSRUNNER_PUBLIC_ORIGIN: ${DOCSRUNNER_PUBLIC_ORIGIN:?Set DOCSRUNNER_PUBLIC_ORIGIN to the public HTTPS origin in .env}
      DOCSRUNNER_DB: /data/budgets.sqlite3
      DOCSRUNNER_EGRESS_NETWORK: docsrunner-egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - budgets:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 1g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 90s
    networks:
      control:
        ipv4_address: 172.29.0.3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOCSRUNNER_DOMAIN: ${DOCSRUNNER_DOMAIN:?Set DOCSRUNNER_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      control:
        ipv4_address: 172.29.0.2
    depends_on: [web]
  proxy:
    profiles: [images]
    image: docsrunner-proxy:local
    build:
      context: ..
      dockerfile: proxy/Dockerfile
    network_mode: none
  sandbox:
    profiles: [images]
    image: docsrunner-sandbox:local
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    network_mode: none
networks:
  control:
    ipam:
      config:
        - subnet: 172.29.0.0/24
volumes:
  budgets:
  caddy_data:
  caddy_config:

